# Release workflow for forge-api — multi-arch manifest stitcher.
# Same pattern as forge-ui's release-manifest.yml — see comments there.

name: Release manifest

on:
  workflow_run:
    workflows: ["Release amd64", "Release arm64"]
    types: [completed]
    # No branches filter: tag builds (v*) report the tag as head_branch and
    # must stitch too — with [main] here, releases never got their manifest.
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit semver to merge (default: compute from HEAD of main)"
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: release-manifest-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  manifest:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Compute version
        id: version
        run: |
          set -euo pipefail
          head_ref="${{ github.event.workflow_run.head_branch }}"
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            version="${{ github.event.inputs.version }}"
            IFS='.' read -r major minor _ <<< "$version"
            minor_tag="${major}.${minor}"
            sha_tag=""
            is_release=true
          elif [[ "$head_ref" == v[0-9]* ]]; then
            # Tag build: the tag IS the version. Never derive a release version
            # from the VERSION file here.
            version="${head_ref#v}"
            IFS='.' read -r major minor _ <<< "$version"
            minor_tag="${major}.${minor}"
            sha_tag=""
            is_release=true
          else
            # Main build: stitch the main-<sha> dev manifest ONLY. Deriving a
            # semver from a stale prerelease VERSION file made every main build
            # rebuild + overwrite an already-published release (rebuilt-beta.2).
            sha_short=$(git rev-parse --short HEAD)
            version="main-${sha_short}"
            minor_tag=""
            sha_tag=""
            is_release=false
          fi

          # :latest must always resolve to the HIGHEST published release. Decide whether the
          # version being stitched is that highest semver, compared against every published tag
          # (the previous logic skipped :latest on explicit-version runs — i.e. on every release —
          # so :latest went stale at an old version).
          img="${{ env.IMAGE_NAME }}"
          tok=$(curl -s "https://ghcr.io/token?scope=repository:${img}:pull&service=ghcr.io" | jq -r '.token // empty')
          published=$(curl -s -H "Authorization: Bearer ${tok}" "https://ghcr.io/v2/${img}/tags/list?n=10000" \
                        | jq -r '.tags[]? // empty' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || true)
          newest=$(printf '%s\n%s\n' "${published}" "${version}" | grep -v '^$' | sort -V | tail -n1)
          is_latest=false; [[ "$is_release" == true && "${newest}" == "${version}" ]] && is_latest=true

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "minor=${minor_tag}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${sha_tag}" >> "$GITHUB_OUTPUT"
          echo "is_latest=${is_latest}" >> "$GITHUB_OUTPUT"
          echo "Computed manifest version: ${version} (minor=${minor_tag} sha_tag=${sha_tag} is_latest=${is_latest}; newest incl this=${newest})"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Stitch per-arch images into manifest list
        env:
          VERSION:   ${{ steps.version.outputs.version }}
          MINOR:     ${{ steps.version.outputs.minor }}
          SHA_TAG:   ${{ steps.version.outputs.sha_tag }}
          IS_LATEST: ${{ steps.version.outputs.is_latest }}
        run: |
          set -euo pipefail
          IMG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

          sources=()
          for arch in amd64 arm64; do
            src="${IMG}:${VERSION}-${arch}"
            if docker buildx imagetools inspect "$src" >/dev/null 2>&1; then
              sources+=("$src")
              echo "found:   $src"
            else
              echo "missing: $src (skipping)"
            fi
          done

          if [[ ${#sources[@]} -eq 0 ]]; then
            echo "No per-arch images found for version ${VERSION}; nothing to stitch."
            exit 0
          fi

          dest_tags=("${IMG}:${VERSION}")
          [[ -n "${MINOR}" ]] && dest_tags+=("${IMG}:${MINOR}")
          [[ -n "${SHA_TAG}" ]] && dest_tags+=("${IMG}:${SHA_TAG}")
          # :latest points at the highest published release only (a main-<sha> build is never
          # "latest"; a release is, when it's the newest — computed in the version step).
          [[ "${IS_LATEST}" == "true" ]] && dest_tags+=("${IMG}:latest")

          tag_args=()
          for t in "${dest_tags[@]}"; do tag_args+=("-t" "$t"); done

          echo "Creating manifest list under: ${dest_tags[*]}"
          echo "Sources: ${sources[*]}"
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"

      - name: Inspect resulting :latest
        if: steps.version.outputs.is_latest == 'true'
        run: |
          docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" || true
